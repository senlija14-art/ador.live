name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK 37
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0" "platform-tools" || true
          if [ ! -d "$ANDROID_SDK/platforms/android-37" ]; then
            yes | "$SDKMANAGER" --install "platforms;android-37.0" || true
            if [ -d "$ANDROID_SDK/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK/platforms/android-37" ]; then
              ln -sfn "$ANDROID_SDK/platforms/android-37.0" "$ANDROID_SDK/platforms/android-37"
            fi
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          set -o pipefail

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live --platforms=android build_proj
          cp pubspec.yaml build_proj/
          [ -f pubspec.lock ] && cp pubspec.lock build_proj/ || true
          rm -rf build_proj/lib
          cp -r lib build_proj/
          [ -d assets ] && cp -r assets build_proj/ || true
          [ -d fonts ] && cp -r fonts build_proj/ || true
          [ -d images ] && cp -r images build_proj/ || true

      - name: Fix pubspec.yaml Name and SDK Constraint
        run: |
          python3 - <<'PY'
          import re

          pub_path = "build_proj/pubspec.yaml"
          with open(pub_path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^name:\s*.+$', text):
              text = re.sub(r'(?m)^name:\s*.+$', 'name: ador_live', text, count=1)
          else:
              text = "name: ador_live\n" + text

          env_pattern = re.compile(r'(?ms)^environment:\s*\n(?:[ \t]+.*\n?)*')
          env_match = env_pattern.search(text)

          if env_match:
              env_block = env_match.group(0)
              if re.search(r'(?m)^[ \t]+sdk:\s*.+$', env_block):
                  sdk_val_match = re.search(r'(?m)^[ \t]+sdk:\s*["\']?([^"\'\n]+)', env_block)
                  sdk_val = sdk_val_match.group(1).strip() if sdk_val_match else ""
                  if not re.search(r'(\^3\.|>=\s*3\.)', sdk_val):
                      new_env = re.sub(r'(?m)^([ \t]+sdk:\s*).+$', r"\1'>=3.5.0 <4.0.0'", env_block, count=1)
                  else:
                      new_env = env_block
              else:
                  new_env = env_block.rstrip('\n') + "\n  sdk: '>=3.5.0 <4.0.0'\n"
              text = text[:env_match.start()] + new_env + text[env_match.end():]
          elif re.search(r'(?m)^environment:\s*$', text):
              text = re.sub(r'(?m)^environment:\s*$', "environment:\n  sdk: '>=3.5.0 <4.0.0'", text, count=1)
          else:
              text = "environment:\n  sdk: '>=3.5.0 <4.0.0'\n\n" + text

          with open(pub_path, "w", encoding="utf-8") as f:
              f.write(text)

          print("pubspec.yaml updated successfully")
          PY

      - name: Install Dependencies
        working-directory: build_proj
        run: |
          flutter pub get

      - name: Configure Android Project
        run: |
          python3 - <<'PY'
          import os
          import re
          import glob

          compile_sdk = 37
          target_sdk = 36
          min_sdk = 24

          def remove_clean_task(content):
              pattern = re.compile(r'(?m)^[ \t]*(?:task\s+clean\b|tasks\.register\s*\(\s*["\']clean["\'])')
              while True:
                  m = pattern.search(content)
                  if not m:
                      break
                  start = m.start()
                  brace_start = content.find('{', m.end())
                  if brace_start == -1:
                      break
                  depth = 0
                  end = brace_start
                  for i in range(brace_start, len(content)):
                      if content[i] == '{':
                          depth += 1
                      elif content[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  content = content[:start] + content[end:]
              return content

          # 1. Patch cached plugins
          pub_cache = os.path.expanduser("~/.pub-cache")
          if os.path.exists(pub_cache):
              for zgradle in glob.glob(f"{pub_cache}/**/zego_zim*/android/build.gradle", recursive=True):
                  with open(zgradle, "r", encoding="utf-8", errors="ignore") as f:
                      zc = f.read()

                  zc = re.sub(r'\bjcenter\(\)', 'mavenCentral()', zc)
                  zc = remove_clean_task(zc)
                  zc = re.sub(r'JavaVersion\.VERSION_1_8|JavaVersion\.VERSION_11', 'JavaVersion.VERSION_17', zc)
                  zc = re.sub(r'(?m)^(\s*compileSdk(?:Version)?\s*=?\s*).*$', rf'\g<1>{compile_sdk}', zc)
                  zc = re.sub(r'(?m)^(\s*minSdk(?:Version)?\s*=?\s*).*$', rf'\g<1>{min_sdk}', zc)

                  if "namespace" not in zc:
                      zc = re.sub(
                          r'(?m)^(\s*android\s*\{\s*\n)',
                          r"\1    namespace 'im.zego.zim_flutter'\n",
                          zc,
                          count=1
                      )

                  with open(zgradle, "w", encoding="utf-8") as f:
                      f.write(zc)
                  print("Patched zego_zim gradle:", zgradle)

              for gfile in glob.glob(f"{pub_cache}/**/*.gradle*", recursive=True):
                  if "zego_zim" in gfile or not os.path.isfile(gfile):
                      continue
                  try:
                      with open(gfile, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      updated = re.sub(r'\bjcenter\(\)', 'mavenCentral()', content)
                      updated = re.sub(
                          r'(?m)^([ \t]*compileSdk(?:Version)?\s*=?\s*)(?:2[0-9]|3[0-6])\b',
                          rf'\g<1>{compile_sdk}',
                          updated
                      )
                      if updated != content:
                          with open(gfile, "w", encoding="utf-8") as f:
                              f.write(updated)
                  except Exception:
                      pass

          # 2. Force compileSdk = 37 and disable buggy Android Lint tasks across all projects
          root_kts = "build_proj/android/build.gradle.kts"
          if os.path.exists(root_kts):
              with open(root_kts, "r", encoding="utf-8") as f:
                  rg = f.read()
              sub_fix = "\n".join([
                  "allprojects {",
                  "    tasks.configureEach {",
                  '        if (name.startsWith("lint")) {',
                  "            enabled = false",
                  "        }",
                  "    }",
                  "}",
                  "subprojects {",
                  "    afterEvaluate {",
                  '        val androidExt = extensions.findByName("android")',
                  "        if (androidExt is com.android.build.api.dsl.LibraryExtension) {",
                  f"            androidExt.compileSdk = {compile_sdk}",
                  "            androidExt.lint.checkReleaseBuilds = false",
                  "            androidExt.lint.abortOnError = false",
                  "            if (androidExt.namespace.isNullOrEmpty()) {",
                  '                androidExt.namespace = "com.ador.plugin." + project.name.replace(Regex("[^a-zA-Z0-9_]"), "_")',
                  "            }",
                  "        }",
                  "    }",
                  "}",
                  "",
              ])
              if "com.android.build.api.dsl.LibraryExtension" not in rg:
                  m_eval = re.search(r'(?m)^subprojects\s*\{\s*\n\s*project\.evaluationDependsOn\(":app"\)', rg)
                  if m_eval:
                      rg = rg[:m_eval.start()] + sub_fix + rg[m_eval.start():]
                  else:
                      rg = rg + "\n" + sub_fix
                  with open(root_kts, "w", encoding="utf-8") as f:
                      f.write(rg)
                  print("Patched root build.gradle.kts")

          # 3. Clean jcenter() in build_proj gradle files
          for gfile in glob.glob("build_proj/android/**/*.gradle*", recursive=True):
              if not os.path.isfile(gfile):
                  continue
              try:
                  with open(gfile, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  updated = re.sub(r'\bjcenter\(\)', 'mavenCentral()', content)
                  if updated != content:
                      with open(gfile, "w", encoding="utf-8") as f:
                          f.write(updated)
              except Exception:
                  pass

          # 4. Update app build.gradle / build.gradle.kts + disable release lint
          base = "build_proj/android/app/"
          path = base + "build.gradle.kts" if os.path.exists(base + "build.gradle.kts") else base + "build.gradle"
          if not os.path.exists(path):
              raise Exception("Android app Gradle file not found")

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          if path.endswith(".kts"):
              s = re.sub(r'(?m)^([ \t]*compileSdk\s*=\s*).*$', rf'\g<1>{compile_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*targetSdk\s*=\s*).*$', rf'\g<1>{target_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*minSdk\s*=\s*).*$', rf'\g<1>{min_sdk}', s)
              if "checkReleaseBuilds" not in s:
                  s = re.sub(
                      r'(?m)^([ \t]*android\s*\{\s*\n)',
                      r'\1    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n',
                      s,
                      count=1
                  )
          else:
              s = re.sub(r'(?m)^([ \t]*compileSdkVersion\s+).*$', rf'\g<1>{compile_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*compileSdk\s+).*$', rf'\g<1>{compile_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*targetSdkVersion\s+).*$', rf'\g<1>{target_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*targetSdk\s+).*$', rf'\g<1>{target_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*minSdkVersion\s+).*$', rf'\g<1>{min_sdk}', s)
              s = re.sub(r'(?m)^([ \t]*minSdk\s+).*$', rf'\g<1>{min_sdk}', s)
              if "checkReleaseBuilds" not in s:
                  s = re.sub(
                      r'(?m)^([ \t]*android\s*\{\s*\n)',
                      r'\1    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n',
                      s,
                      count=1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          # 5. Update AndroidManifest.xml
          manifest = "build_proj/android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              m = f.read()

          perms = [
              ('android.permission.INTERNET', '<uses-permission android:name="android.permission.INTERNET"/>'),
              ('android.permission.ACCESS_NETWORK_STATE', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'),
              ('android.permission.ACCESS_WIFI_STATE', '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>'),
              ('android.permission.RECORD_AUDIO', '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'),
              ('android.permission.MODIFY_AUDIO_SETTINGS', '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>'),
              ('android.permission.CAMERA', '<uses-permission android:name="android.permission.CAMERA"/>'),
              ('android.permission.BLUETOOTH"', '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>'),
              ('android.permission.BLUETOOTH_CONNECT', '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>'),
              ('android.permission.WAKE_LOCK', '<uses-permission android:name="android.permission.WAKE_LOCK"/>'),
              ('android.permission.READ_MEDIA_IMAGES', '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>'),
              ('android.permission.READ_EXTERNAL_STORAGE', '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'),
          ]

          missing = [f"    {tag}" for key, tag in perms if key not in m]
          if missing:
              m = re.sub(
                  r'(?m)^[ \t]*<application\b',
                  "\n".join(missing) + "\n\n    <application",
                  m,
                  count=1
              )

          m = re.sub(
              r'(<application\b[^>]*?\bandroid:label=")[^"]*(")',
              r'\g<1>আদর লাইভ\g<2>',
              m,
              count=1,
              flags=re.DOTALL
          )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(m)

          print("Android configuration completed successfully")
          PY

      - name: Verify Android SDK
        working-directory: build_proj
        run: |
          grep -nE "compileSdk|targetSdk|minSdk" android/app/build.gradle* || true
          flutter doctor -v

      - name: Build Release APK
        working-directory: build_proj
        run: |
          flutter build apk --release

      - name: Upload Ador Live APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
