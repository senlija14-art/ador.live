
name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live build_proj
          cp pubspec.yaml build_proj/
          rm -rf build_proj/lib
          cp -r lib build_proj/

      - name: Install Dependencies
        working-directory: build_proj
        run: flutter pub get

      - name: Build APK
        working-directory: build_proj
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
