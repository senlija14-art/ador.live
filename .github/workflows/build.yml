
      - name: Build APK
        working-directory: build_proj
        run: |
          flutter pub get

          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/zego_zim-*/android/build.gradle"
          ))

          if not files:
              raise Exception("Zego ZIM Gradle file not found")

          for p in files:
              s = p.read_text()

              s = re.sub(
                  r'\bjcenter\s*\(\s*\)',
                  'mavenCentral()',
                  s
              )

              lines = s.splitlines()
              android = [
                  i for i, line in enumerate(lines)
                  if re.search(
                      r"(?:apply\s+plugin:\s*|id\s*\(?\s*)['\"]com.android.library['\"]",
                      line
                  )
              ]
              kotlin = [
                  i for i, line in enumerate(lines)
                  if re.search(
                      r"(?:apply\s+plugin:\s*|id\s*\(?\s*)['\"](?:kotlin-android|org.jetbrains.kotlin.android)['\"]",
                      line
                  )
              ]

              if android and kotlin and kotlin[0] < android[0]:
                  lines[kotlin[0]], lines[android[0]] = (
                      lines[android[0]], lines[kotlin[0]]
                  )

              p.write_text('\n'.join(lines) + '\n')
              print("Patched:", p)

          PY

          flutter build apk --release
