
name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live build_proj
          cp pubspec.yaml build_proj/
          rm -rf build_proj/lib
          cp -r lib build_proj/

      - name: Configure Compile SDK 37
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("build_proj/android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()
              s, n = re.subn(
                  r'(?m)^\s*compileSdk\s*=\s*.*$',
                  '    compileSdk = 37',
                  s,
                  count=1
              )
          else:
              p = Path("build_proj/android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Android app Gradle file missing")

              s = p.read_text()
              s, n = re.subn(
                  r'(?m)^\s*compileSdkVersion\s+.*$',
                  '    compileSdkVersion 37',
                  s,
                  count=1
              )

          if n != 1:
              raise SystemExit("Could not update compileSdk")

          p.write_text(s)
          print("SUCCESS: compileSdk set to 37")

          PY

      - name: Install Dependencies
        working-directory: build_proj
        run: flutter pub get

      - name: Build Release APK
        working-directory: build_proj
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
