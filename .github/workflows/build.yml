
name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live build_proj
          cp pubspec.yaml build_proj/
          rm -rf build_proj/lib
          cp -r lib build_proj/

      - name: Install Flutter Packages
        working-directory: build_proj
        run: flutter pub get

      - name: Repair Zego Gradle Files
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/zego_zim-*/android/build.gradle"
          ))

          files += list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/zego_zim-*/android/build.gradle.kts"
          ))

          if not files:
              raise SystemExit("ERROR: Zego ZIM Gradle file not found")

          for p in files:
              s = p.read_text()

              s = re.sub(
                  r'\bjcenter\s*\(\s*\)',
                  'mavenCentral()',
                  s
              )

              lines = s.splitlines()

              android = [
                  i for i, line in enumerate(lines)
                  if re.search(
                      r"(?:apply\s+plugin\s*:\s*|id\s*\(?\s*)['\"]com\.android\.(?:library|application)['\"]",
                      line
                  )
              ]

              kotlin = [
                  i for i, line in enumerate(lines)
                  if re.search(
                      r"(?:apply\s+plugin\s*:\s*|id\s*\(?\s*)['\"](?:kotlin-android|org\.jetbrains\.kotlin\.android)['\"]",
                      line
                  )
              ]

              if kotlin and not android:
                  lines.insert(
                      kotlin[0],
                      "apply plugin: 'com.android.library'"
                  )

              elif android and kotlin and android[0] > kotlin[0]:
                  lines[android[0]], lines[kotlin[0]] = (
                      lines[kotlin[0]], lines[android[0]]
                  )

              s = "\n".join(lines) + "\n"

              if "jcenter()" in s:
                  raise SystemExit("ERROR: jcenter still exists")

              p.write_text(s)
              print("REPAIRED:", p)

          PY

      - name: Build Release APK
        working-directory: build_proj
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
