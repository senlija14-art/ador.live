name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live --platforms=android build_proj
          cp pubspec.yaml build_proj/
          [ -f pubspec.lock ] && cp pubspec.lock build_proj/ || true
          rm -rf build_proj/lib
          cp -r lib build_proj/

      - name: Fix pubspec.yaml Name and SDK Constraint
        run: |
          python3 - <<'PY'
          import re

          pub_path = "build_proj/pubspec.yaml"
          with open(pub_path, "r", encoding="utf-8") as f:
              text = f.read()

          if re.search(r'(?m)^name:\s*.+$', text):
              text = re.sub(r'(?m)^name:\s*.+$', 'name: ador_live', text, count=1)
          else:
              text = "name: ador_live\n" + text

          if re.search(r'(?m)^environment:\s*\n(?:\s+.*\n)*?\s*sdk:\s*.+', text):
              text = re.sub(r'(?m)^(\s*sdk:\s*).+$', r"\1'^3.14.0'", text, count=1)
          elif re.search(r'(?m)^environment:\s*$', text):
              text = re.sub(r'(?m)^environment:\s*$', "environment:\n  sdk: '^3.14.0'", text, count=1)
          else:
              text = "environment:\n  sdk: '^3.14.0'\n\n" + text

          with open(pub_path, "w", encoding="utf-8") as f:
              f.write(text)

          print("pubspec.yaml updated successfully")
          PY

      - name: Install Dependencies
        working-directory: build_proj
        run: |
          flutter pub get

      - name: Configure Android Project
        run: |
          python3 - <<'PY'
          import os
          import re
          import glob

          compile_target_sdk = 36
          min_sdk = 24

          # 1. Fix zego_zim build.gradle to prevent duplicate 'clean' task & AGP extension errors
          pub_cache = os.path.expanduser("~/.pub-cache")
          if os.path.exists(pub_cache):
              for zgradle in glob.glob(f"{pub_cache}/**/zego_zim*/android/build.gradle", recursive=True):
                  clean_zego_gradle = """apply plugin: 'com.android.library'

android {
    namespace 'im.zego.zim_flutter'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
}
"""
                  with open(zgradle, "w", encoding="utf-8") as f:
                      f.write(clean_zego_gradle)
                  print("Patched zego_zim gradle:", zgradle)

              # Clean jcenter() from other cached gradle files
              for gfile in glob.glob(f"{pub_cache}/**/*.gradle*", recursive=True):
                  if "zego_zim" in gfile:
                      continue
                  try:
                      with open(gfile, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      updated = re.sub(r'\bjcenter\(\)', 'mavenCentral()', content)
                      if updated != content:
                          with open(gfile, "w", encoding="utf-8") as f:
                              f.write(updated)
                  except Exception:
                      pass

          # 2. Clean jcenter() in build_proj gradle files
          for gfile in glob.glob("build_proj/android/**/*.gradle*", recursive=True):
              try:
                  with open(gfile, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  updated = re.sub(r'\bjcenter\(\)', 'mavenCentral()', content)
                  if updated != content:
                      with open(gfile, "w", encoding="utf-8") as f:
                          f.write(updated)
              except Exception:
                  pass

          # 3. Update app build.gradle / build.gradle.kts
          base = "build_proj/android/app/"
          kts = base + "build.gradle.kts"
          groovy = base + "build.gradle"

          if os.path.exists(kts):
              path = kts
          elif os.path.exists(groovy):
              path = groovy
          else:
              raise Exception("Android app Gradle file not found")

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          if path.endswith(".kts"):
              s = re.sub(r'compileSdk\s*=.*', f'compileSdk = {compile_target_sdk}', s)
              s = re.sub(r'targetSdk\s*=.*', f'targetSdk = {compile_target_sdk}', s)
              s = re.sub(r'minSdk\s*=.*', f'minSdk = {min_sdk}', s)
          else:
              s = re.sub(r'compileSdkVersion\s+.*', f'compileSdkVersion {compile_target_sdk}', s)
              s = re.sub(r'compileSdk\s+.*', f'compileSdk {compile_target_sdk}', s)
              s = re.sub(r'targetSdkVersion\s+.*', f'targetSdkVersion {compile_target_sdk}', s)
              s = re.sub(r'targetSdk\s+.*', f'targetSdk {compile_target_sdk}', s)
              s = re.sub(r'minSdkVersion\s+.*', f'minSdkVersion {min_sdk}', s)
              s = re.sub(r'minSdk\s+.*', f'minSdk {min_sdk}', s)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          # 4. Update AndroidManifest.xml
          manifest = "build_proj/android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              m = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          """

          if "android.permission.INTERNET" not in m:
              m = m.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          m = re.sub(
              r'android:label="[^"]*"',
              'android:label="আদর লাইভ"',
              m,
              count=1
          )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(m)

          print("Android configuration completed successfully")
          PY

      - name: Verify Android SDK
        working-directory: build_proj
        run: |
          grep -n "compileSdk" android/app/build.gradle*
          flutter doctor -v

      - name: Build Release APK
        working-directory: build_proj
        run: |
          flutter build apk --release

      - name: Upload Ador Live APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
