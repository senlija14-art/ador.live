
name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live build_proj
          cp pubspec.yaml build_proj/
          rm -rf build_proj/lib
          cp -r lib build_proj/

      - name: Get Dependencies
        working-directory: build_proj
        run: flutter pub get

      - name: Fix Zego Android Gradle
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/zego_zim-*/android/build.gradle"
          ))

          if not files:
              raise Exception("Zego ZIM Gradle file not found")

          for p in files:
              s = p.read_text()
              s = re.sub(r'\bjcenter\s*\(\s*\)',
                         'mavenCentral()', s)

              lines = s.splitlines()

              android = [
                  i for i, x in enumerate(lines)
                  if "com.android.library" in x
                  and ("apply plugin" in x or "id " in x)
              ]

              kotlin = [
                  i for i, x in enumerate(lines)
                  if ("kotlin-android" in x or
                      "org.jetbrains.kotlin.android" in x)
                  and ("apply plugin" in x or "id " in x)
              ]

              if android and kotlin and kotlin[0] < android[0]:
                  lines[android[0]], lines[kotlin[0]] = (
                      lines[kotlin[0]], lines[android[0]]
                  )

              p.write_text("\n".join(lines) + "\n")
              print("Fixed:", p)

          PY

      - name: Build APK
        working-directory: build_proj
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
