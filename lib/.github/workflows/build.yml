
name: Build Ador Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android Project
        run: |
          flutter create --org com.ador.live --project-name ador_live build_proj
          cp pubspec.yaml build_proj/
          rm -rf build_proj/lib build_proj/test
          cp -r lib build_proj/

      - name: Configure Android
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("build_proj/android")

          for name in ["build.gradle", "build.gradle.kts"]:
              p = root / name
              if p.exists():
                  s = p.read_text()
                  s = s.replace("jcenter()", "mavenCentral()")
                  p.write_text(s)

          p = Path.home()
          files = list(p.glob(
              ".pub-cache/hosted/pub.dev/zego_zim-*/android/build.gradle"
          ))

          for f in files:
              s = f.read_text()
              s = re.sub(
                  r'\bjcenter\s*\(\s*\)',
                  'mavenCentral()',
                  s
              )

              lines = s.splitlines()
              android = [
                  i for i, x in enumerate(lines)
                  if "com.android.library" in x
                  and ("apply plugin" in x or "id " in x)
              ]
              kotlin = [
                  i for i, x in enumerate(lines)
                  if ("kotlin-android" in x or
                      "org.jetbrains.kotlin.android" in x)
                  and ("apply plugin" in x or "id " in x)
              ]

              if android and kotlin and kotlin[0] < android[0]:
                  lines[kotlin[0]], lines[android[0]] = (
                      lines[android[0]], lines[kotlin[0]]
                  )

              f.write_text("\n".join(lines) + "\n")
              print("Patched:", f)

          app = root / "app"
          rules = app / "proguard-rules.pro"
          rules.write_text(
              "-keep class **.zego.** { *; }\n"
              "-keep class **.**.zego_zpns.** { *; }\n"
          )
          PY

      - name: Build APK
        working-directory: build_proj
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Ador Live APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Live-APK
          path: build_proj/build/app/outputs/flutter-apk/app-release.apk
